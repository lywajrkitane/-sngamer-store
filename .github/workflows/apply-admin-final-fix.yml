name: Apply final admin dashboard fix

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/apply-admin-final-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject final admin fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('server/bootstrap.js')
          text = path.read_text(encoding='utf-8')

          old = "html=html.replace(/<\\/body>/i,'<script src=\"/admin-v24-workspace.js?v=20261017-0745\"></script></body>');"
          new = "html=html.replace(/<\\/body>/i,'<script src=\"/admin-v24-workspace.js?v=20261017-0745\"></script><script src=\"/admin-final-fix.js?v=20261018-1\"></script></body>');"

          if old in text and new not in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('Injected admin-final-fix.js')
          elif new in text:
              print('admin-final-fix.js already injected')
          else:
              raise SystemExit('Expected bootstrap injection marker not found')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/bootstrap.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Apply final admin dashboard auto-load and stats fix"
          git push
