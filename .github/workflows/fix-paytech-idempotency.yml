name: One-time PayTech idempotency fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch payment order insert
        shell: python
        run: |
          from pathlib import Path
          p = Path('server/paytech.js')
          s = p.read_text(encoding='utf-8')
          old = '''`INSERT INTO orders (status,customer,payment,items,total,payment_status,payment_method,paytech_ref)\n         VALUES ('Nouvelle',$1,$2,$3,$4,'En attente',$2,$5) RETURNING id`,\n        [JSON.stringify(orderCustomer), payment, JSON.stringify(finalItems), total, refCommand]'''
          new = '''`INSERT INTO orders (status,customer,payment,items,total,payment_status,payment_method,paytech_ref,payment_request_key)\n         VALUES ('Nouvelle',$1,$2,$3,$4,'En attente',$2,$5,$6) RETURNING id`,\n        [JSON.stringify(orderCustomer), payment, JSON.stringify(finalItems), total, refCommand, paymentRequestKey || null]'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'payment_request_key)' not in s:
              raise SystemExit('Expected PayTech order insert was not found.')
          p.write_text(s, encoding='utf-8')
      - name: Validate
        run: node --check server/paytech.js
      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          set -e
          rm -f .github/workflows/fix-paytech-idempotency.yml
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/paytech.js .github/workflows/fix-paytech-idempotency.yml
          git commit -m 'fix(payment): persist PayTech idempotency key'
          git push
