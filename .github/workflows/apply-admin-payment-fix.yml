name: Apply admin payment/dashboard fix

on:
  push:
    paths:
      - '.github/workflows/apply-admin-payment-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          # 1) Admin API must expose the real PayTech payment state.
          p = Path('server/server.js')
          s = p.read_text(encoding='utf-8')
          old = '''          payment,\n          items,\n          total\n        FROM orders'''
          new = '''          payment,\n          payment_status,\n          payment_method,\n          paid_at,\n          items,\n          total\n        FROM orders'''
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # 2) Runtime fix for the actual v24 admin workspace. The previous v23
          # loader was not the final controller used by bootstrap, so install a
          # small independent loader after the v24 workspace instead of replacing it.
          live = Path('public/admin-live-orders-fix.js')
          live.write_text(r'''/* SNGAMER STORE — live admin orders/payment fix */
(function () {
  'use strict';

  let wrapped = null;
  let lastVisible = false;

  async function reloadOrders() {
    try {
      if (typeof window.loadOrders === 'function') {
        await window.loadOrders();
        return;
      }
      if (typeof window.loadAll === 'function') {
        await window.loadAll();
      }
    } catch (error) {
      console.error('ADMIN_LIVE_ORDERS_LOAD_ERROR:', error);
    }
  }

  function wrapLoader() {
    const fn = window.loadOrders;
    if (typeof fn !== 'function' || fn === wrapped) return;
    const original = fn;
    const wrappedFn = async function () {
      const result = await original.apply(this, arguments);
      return result;
    };
    wrapped = wrappedFn;
    window.loadOrders = wrappedFn;
  }

  function isAdminVisible() {
    const box = document.getElementById('adminBox');
    return !!box && !box.classList.contains('hidden');
  }

  function patchLegacyPaymentCells() {
    document.querySelectorAll('#ordersTable tr').forEach(row => {
      const cells = row.querySelectorAll('td');
      if (cells.length < 6) return;
      const idText = (cells[0].textContent || '').trim().replace('#', '');
      if (!/^\d+$/.test(idText)) return;
      const rowData = window.__sngamerAdminOrders?.find(o => String(o.id) === idText);
      if (!rowData) return;
      const payment = String(rowData.payment_status || (String(rowData.status).toLowerCase() === 'payée' ? 'Payé' : 'En attente'));
      const method = String(rowData.payment || '-');
      cells[5].innerHTML = method + '<br><small style="color:#8f9db3;font-weight:700;">' + payment + '</small>';
    });
  }

  async function fetchAndRememberOrders() {
    try {
      const response = await fetch('/api/admin/orders', { credentials: 'same-origin', cache: 'no-store' });
      if (!response.ok) return;
      const data = await response.json();
      if (Array.isArray(data)) window.__sngamerAdminOrders = data;
      patchLegacyPaymentCells();
    } catch (error) {
      console.error('ADMIN_LIVE_ORDERS_API_ERROR:', error);
    }
  }

  function start() {
    wrapLoader();

    const observer = new MutationObserver(() => {
      const visible = isAdminVisible();
      if (visible && !lastVisible) {
        lastVisible = true;
        setTimeout(reloadOrders, 150);
        setTimeout(reloadOrders, 700);
        setTimeout(fetchAndRememberOrders, 1300);
      } else if (!visible) {
        lastVisible = false;
      }
    });

    const box = document.getElementById('adminBox');
    if (box) observer.observe(box, { attributes: true, attributeFilter: ['class'] });

    setTimeout(() => {
      if (isAdminVisible()) {
        reloadOrders();
        fetchAndRememberOrders();
      }
    }, 250);

    setInterval(() => {
      wrapLoader();
      if (isAdminVisible()) fetchAndRememberOrders();
    }, 15000);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, { once: true });
  else start();
})();
''', encoding='utf-8')

          # 3) Bootstrap is the real source of the final admin HTML. Inject the
          # live fix after the existing v24 workspace without disturbing it.
          p = Path('server/bootstrap.js')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="/admin-live-orders-fix.js?v=20261018-1"></script>'
          if tag not in s:
              marker = 'res.type("html").send(html)'
              if marker not in s:
                  raise SystemExit('bootstrap injection marker not found')
              s = s.replace(marker, f'html=html.replace(/<\\/body>/i,\'{tag}</body>\');{marker}', 1)
              p.write_text(s, encoding='utf-8')

          print('Admin/PayTech runtime fixes prepared.')

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/server.js server/bootstrap.js public/admin-live-orders-fix.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix live admin orders and PayTech payment status"
          git push origin HEAD:main
