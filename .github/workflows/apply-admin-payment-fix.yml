name: Apply admin payment/dashboard fix

on:
  push:
    paths:
      - '.github/workflows/apply-admin-payment-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply fixes
        shell: python
        run: |
          from pathlib import Path

          # 1) Admin API must expose the real PayTech payment state.
          p = Path('server/server.js')
          s = p.read_text(encoding='utf-8')
          old = '''          payment,\n          items,\n          total\n        FROM orders'''
          new = '''          payment,\n          payment_status,\n          payment_method,\n          paid_at,\n          items,\n          total\n        FROM orders'''
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # 2) PayTech must update ONLY the payment state. The order workflow
          # state remains "Nouvelle" until the admin changes it.
          p = Path('server/paytech.js')
          s = p.read_text(encoding='utf-8')
          old = "UPDATE orders SET status='Payée',payment_status='Payé',payment_method=$1,paid_at=NOW(),paytech_token=COALESCE($2,paytech_token) WHERE id=$3"
          new = "UPDATE orders SET payment_status='Payé',payment_method=$1,paid_at=NOW(),paytech_token=COALESCE($2,paytech_token) WHERE id=$3"
          if old not in s:
              raise SystemExit('PayTech paid-status target not found')
          s = s.replace(old, new, 1)

          # Normalize old records created by the previous bug: a paid order
          # must no longer use "Payée" as its order workflow status.
          marker = "  await pool.query(`\n    DO $$"
          migration = "  await pool.query(`UPDATE orders SET status='Nouvelle' WHERE status='Payée' AND payment_status='Payé'`);\n\n"
          if migration not in s:
              if marker not in s:
                  raise SystemExit('PayTech migration marker not found')
              s = s.replace(marker, migration + marker, 1)
          p.write_text(s, encoding='utf-8')

          # 3) Replace the fragile v23 initial loader. The old version ran
          # before the admin session existed, received 401, and then stopped;
          # therefore orders only appeared after clicking Actualiser.
          p = Path('public/admin-v23-orders.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("if(response.status===401){location.reload();return;}", "if(response.status===401){return;}", 1)
          old_tail = '''  window.loadOrders=load;\n  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',()=>{ensureWorkspace();setTimeout(load,50)});\n  else {ensureWorkspace();setTimeout(load,50);}\n})();'''
          new_tail = '''  window.loadOrders=load;\n\n  function startAutoLoad(){\n    ensureWorkspace();\n    const box=document.getElementById('adminBox');\n    let wasVisible=!!box && !box.classList.contains('hidden');\n    if(wasVisible) setTimeout(load,150);\n    if(box){\n      const observer=new MutationObserver(()=>{\n        const visible=!box.classList.contains('hidden');\n        if(visible && !wasVisible){\n          wasVisible=true;\n          setTimeout(load,100);\n          setTimeout(load,800);\n        }else if(!visible){\n          wasVisible=false;\n        }\n      });\n      observer.observe(box,{attributes:true,attributeFilter:['class']});\n    }\n    setInterval(()=>{\n      if(box && !box.classList.contains('hidden')) load();\n    },30000);\n  }\n\n  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',startAutoLoad,{once:true});\n  else startAutoLoad();\n})();'''
          if old_tail not in s:
              raise SystemExit('v23 loader tail not found')
          s = s.replace(old_tail, new_tail, 1)
          p.write_text(s, encoding='utf-8')

          print('PayTech/order status separation and admin auto-load fixes prepared.')

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/server.js server/paytech.js public/admin-v23-orders.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix PayTech payment status and admin auto-load"
          git push origin HEAD:main
