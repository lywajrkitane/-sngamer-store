name: Finalize admin workspace cache version

on:
  workflow_run:
    workflows: ["Inject admin V2.7 workspace"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update admin workspace asset version
        shell: python
        run: |
          from pathlib import Path
          import re

          version = '20261025-0835-workspace5'
          changed = False

          for filename in ('public/admin.html', 'public/admin-dashboard.html'):
              p = Path(filename)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              new_s = re.sub(
                  r'(/admin-v24-workspace\.js\?v=)[^"\']+',
                  rf'\g<1>{version}',
                  s,
              )
              if new_s != s:
                  p.write_text(new_s, encoding='utf-8')
                  changed = True

          p = Path('server/bootstrap.js')
          if p.exists():
              s = p.read_text(encoding='utf-8')
              new_s = re.sub(
                  r'(/admin-v24-workspace\.js\?v=)[^"\']+',
                  rf'\g<1>{version}',
                  s,
              )
              if new_s != s:
                  p.write_text(new_s, encoding='utf-8')
                  changed = True

          p = Path('.github/workflows/inject-admin-v24.yml')
          if p.exists():
              s = p.read_text(encoding='utf-8')
              new_s = re.sub(r"version = '[^']+'", f"version = '{version}'", s, count=1)
              if new_s != s:
                  p.write_text(new_s, encoding='utf-8')
                  changed = True

          print(f'admin workspace cache version finalized: {version}; changed={changed}')

      - name: Commit only when needed
        shell: bash
        run: |
          set -e
          if git diff --quiet; then
            echo "No cache-version changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/admin.html public/admin-dashboard.html server/bootstrap.js .github/workflows/inject-admin-v24.yml
          git commit -m "fix: finalize admin workspace cache busting"
          git push
