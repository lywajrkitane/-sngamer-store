name: Inject admin V2.7 workspace

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Node.js syntax
        shell: bash
        run: |
          set -e
          node --check server/bootstrap.js
          node --check server/server.js
          node --check server/paytech.js
          node --check server/customer-system.js
          node --check public/admin-data-fix.js

      - name: Refresh admin workspace script version
        shell: python
        run: |
          from pathlib import Path
          import re

          version = '20261018-1146'
          workspace_tag = f'<script src="/admin-v24-workspace.js?v={version}"></script>'
          fix_tag = f'<script src="/admin-data-fix.js?v={version}"></script>'

          changed = []
          for filename in ('public/admin.html', 'public/admin-dashboard.html'):
              p = Path(filename)
              if not p.exists():
                  print(f'{filename} not found; skipping')
                  continue

              s = p.read_text(encoding='utf-8')
              pattern = r'<script\s+src=["\']/admin-v24-workspace\.js\?v=[^"\']+["\']\s*></script>'
              new_s = re.sub(pattern, workspace_tag, s, count=1) if re.search(pattern, s) else s.replace('</body>', workspace_tag + '\n</body>', 1)

              fix_pattern = r'<script\s+src=["\']/admin-data-fix\.js\?v=[^"\']+["\']\s*></script>'
              new_s = re.sub(fix_pattern, fix_tag, new_s, count=1) if re.search(fix_pattern, new_s) else new_s.replace('</body>', fix_tag + '\n</body>', 1)

              if new_s != s:
                  p.write_text(new_s, encoding='utf-8')
                  changed.append(filename)

          for filename in ('server/bootstrap.js', 'server/admin-data-fix-preload.js'):
              p = Path(filename)
              if not p.exists():
                  print(f'{filename} not found; skipping')
                  continue
              s = p.read_text(encoding='utf-8')
              new_s = re.sub(r'(/admin-data-fix\.js\?v=)\d+', rf'\g<1>{version}', s)
              if new_s != s:
                  p.write_text(new_s, encoding='utf-8')
                  changed.append(filename)

          print('Updated:', ', '.join(changed) if changed else 'none')

      - name: Commit injection
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/admin.html public/admin-dashboard.html server/bootstrap.js server/admin-data-fix-preload.js
          git commit -m 'fix(admin): bust cached auto-refresh script version'
          git push
