name: Inject admin V2.7 workspace

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Node.js syntax
        shell: bash
        run: |
          set -e
          node --check server/bootstrap.js
          node --check server/server.js
          node --check server/paytech.js
          node --check server/customer-system.js
          node --check public/admin-data-fix.js

      - name: Validate inline admin JavaScript
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import re

          index = 0
          for filename in ('public/admin.html', 'public/admin-dashboard.html'):
              html = Path(filename).read_text(encoding='utf-8')
              scripts = re.findall(r'<script\b([^>]*)>([\s\S]*?)</script\s*>', html, re.IGNORECASE)
              for attrs, body in scripts:
                  if re.search(r'\bsrc\s*=', attrs, re.IGNORECASE) or not body.strip():
                      continue
                  index += 1
                  Path(f'/tmp/sngamer-admin-inline-{index}.js').write_text(body, encoding='utf-8')
          print(f'Extracted {index} inline admin scripts for syntax checking.')
          PY
          for file in /tmp/sngamer-admin-inline-*.js; do
            node --check "$file"
          done

      - name: Harden admin authentication and session security
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('server/server.js')
          s = p.read_text(encoding='utf-8')

          old_session = '''app.use(\n  session({\n    secret: process.env.SESSION_SECRET || "sngamer-development-secret",\n    resave: false,\n    saveUninitialized: false,\n    cookie: {\n      httpOnly: true,\n      secure: process.env.NODE_ENV === "production",\n      maxAge: 1000 * 60 * 60 * 24\n    }\n  })\n);'''

          new_session = '''app.use(\n  session({\n    name: "sngamer.sid",\n    secret: process.env.SESSION_SECRET || "sngamer-development-secret",\n    resave: false,\n    saveUninitialized: false,\n    rolling: true,\n    cookie: {\n      httpOnly: true,\n      secure: process.env.NODE_ENV === "production",\n      sameSite: "lax",\n      maxAge: 1000 * 60 * 60 * 8\n    }\n  })\n);'''

          if old_session in s:
              s = s.replace(old_session, new_session, 1)
          elif 'name: "sngamer.sid"' not in s:
              raise SystemExit('Expected session configuration was not found.')

          marker = 'function requireAdmin(req, res, next) {'
          rate_limit_block = '''const adminLoginAttempts = new Map();\nconst ADMIN_LOGIN_WINDOW_MS = 15 * 60 * 1000;\nconst ADMIN_LOGIN_MAX_ATTEMPTS = 5;\n\nfunction checkAdminLoginRateLimit(ip) {\n  const now = Date.now();\n  const current = adminLoginAttempts.get(ip);\n  const attempts = current && now - current.startedAt < ADMIN_LOGIN_WINDOW_MS\n    ? current\n    : { startedAt: now, count: 0 };\n\n  if (attempts.count >= ADMIN_LOGIN_MAX_ATTEMPTS) {\n    return false;\n  }\n\n  attempts.count += 1;\n  adminLoginAttempts.set(ip, attempts);\n  return true;\n}\n\n'''
          if 'const adminLoginAttempts = new Map();' not in s:
              if marker not in s:
                  raise SystemExit('Admin authentication marker not found.')
              s = s.replace(marker, rate_limit_block + marker, 1)

          start = s.find('app.post("/api/admin/login", async (req, res) => {')
          end_marker = '\napp.post("/api/admin/logout", (req, res) => {'
          end = s.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('Admin login route boundaries not found.')

          login_route = '''app.post("/api/admin/login", async (req, res) => {\n  try {\n    const { username, password } = req.body || {};\n    const adminUser = process.env.ADMIN_USER;\n    const adminPassword = process.env.ADMIN_PASSWORD;\n\n    if (!adminUser || !adminPassword) {\n      return res.status(500).json({\n        error: "Configuration administrateur manquante"\n      });\n    }\n\n    if (!checkAdminLoginRateLimit(req.ip)) {\n      return res.status(429).json({\n        error: "Trop de tentatives de connexion. Réessayez plus tard."\n      });\n    }\n\n    if (username !== adminUser) {\n      return res.status(401).json({\n        error: "Identifiants incorrects"\n      });\n    }\n\n    let passwordValid = false;\n\n    if (\n      adminPassword.startsWith("$2a$") ||\n      adminPassword.startsWith("$2b$") ||\n      adminPassword.startsWith("$2y$")\n    ) {\n      passwordValid = await bcrypt.compare(password || "", adminPassword);\n    } else {\n      passwordValid = password === adminPassword;\n    }\n\n    if (!passwordValid) {\n      return res.status(401).json({\n        error: "Identifiants incorrects"\n      });\n    }\n\n    await new Promise((resolve, reject) => {\n      req.session.regenerate((error) => {\n        if (error) {\n          reject(error);\n          return;\n        }\n\n        req.session.admin = true;\n        req.session.save((saveError) => {\n          if (saveError) {\n            reject(saveError);\n            return;\n          }\n          resolve();\n        });\n      });\n    });\n\n    adminLoginAttempts.delete(req.ip);\n\n    return res.json({\n      success: true\n    });\n  } catch (error) {\n    console.error("ADMIN_LOGIN_ERROR:", error);\n\n    return res.status(500).json({\n      error: "Erreur de connexion"\n    });\n  }\n});\n'''

          s = s[:start] + login_route + s[end:]

          old_logout = '''app.post("/api/admin/logout", (req, res) => {\n  req.session.destroy(() => {\n    res.json({\n      success: true\n    });\n  });\n});'''
          new_logout = '''app.post("/api/admin/logout", (req, res) => {\n  req.session.destroy((error) => {\n    res.clearCookie("sngamer.sid");\n\n    if (error) {\n      return res.status(500).json({\n        error: "Impossible de fermer la session"\n      });\n    }\n\n    return res.json({\n      success: true\n    });\n  });\n});'''
          if old_logout in s:
              s = s.replace(old_logout, new_logout, 1)

          p.write_text(s, encoding='utf-8')
          print('Admin authentication hardening applied.')

      - name: Refresh admin workspace script version
        shell: python
        run: |
          from pathlib import Path
          import re

          version = '20261018-1220'
          workspace_tag = f'<script src="/admin-v24-workspace.js?v={version}"></script>'
          fix_tag = f'<script src="/admin-data-fix.js?v={version}"></script>'

          changed = []
          for filename in ('public/admin.html', 'public/admin-dashboard.html'):
              p = Path(filename)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              pattern = r'<script\s+src=["\']/admin-v24-workspace\.js\?v=[^"\']+["\']\s*></script>'
              new_s = re.sub(pattern, workspace_tag, s, count=1) if re.search(pattern, s) else s.replace('</body>', workspace_tag + '\n</body>', 1)
              fix_pattern = r'<script\s+src=["\']/admin-data-fix\.js\?v=[^"\']+["\']\s*></script>'
              new_s = re.sub(fix_pattern, fix_tag, new_s, count=1) if re.search(fix_pattern, new_s) else new_s.replace('</body>', fix_tag + '\n</body>', 1)
              if new_s != s:
                  p.write_text(new_s, encoding='utf-8')
                  changed.append(filename)

          for filename in ('server/bootstrap.js', 'server/admin-data-fix-preload.js'):
              p = Path(filename)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              new_s = re.sub(r'(/admin-data-fix\.js\?v=)[^"\']+', rf'\g<1>{version}', s)
              if new_s != s:
                  p.write_text(new_s, encoding='utf-8')
                  changed.append(filename)
          print('Updated:', ', '.join(changed) if changed else 'none')

      - name: Commit injection
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/server.js public/admin.html public/admin-dashboard.html public/admin-data-fix.js server/customer-system.js server/bootstrap.js server/admin-data-fix-preload.js .github/workflows/inject-admin-v24.yml
          git commit -m 'security(admin): harden authentication and sessions'
          git push
