name: Inject admin V2.4 workspace

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject V2.4 script into admin.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('public/admin.html')
          s = p.read_text(encoding='utf-8')
          marker = 'admin-v24-workspace.js'
          if marker not in s:
              tag = '<script src="/admin-v24-workspace.js?v=20261016-2024"></script>\n'
              if '</body>' not in s:
                  raise SystemExit('admin.html has no closing body tag')
              s = s.replace('</body>', tag + '</body>', 1)
              p.write_text(s, encoding='utf-8')
          else:
              print('V2.4 already injected')

      - name: Commit injection
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/admin.html
          git commit -m 'fix(admin): load isolated V2.4 workspace'
          git push
