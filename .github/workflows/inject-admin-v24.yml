name: Inject admin V2.7 workspace

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Node.js syntax
        shell: bash
        run: |
          set -e
          node --check server/bootstrap.js
          node --check server/server.js
          node --check server/paytech.js
          node --check server/customer-system.js
          node --check public/admin-data-fix.js

      - name: Validate inline admin JavaScript
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import re

          index = 0
          for filename in ('public/admin.html', 'public/admin-dashboard.html'):
              html = Path(filename).read_text(encoding='utf-8')
              scripts = re.findall(r'<script\b([^>]*)>([\s\S]*?)</script\s*>', html, re.IGNORECASE)
              for attrs, body in scripts:
                  if re.search(r'\bsrc\s*=', attrs, re.IGNORECASE) or not body.strip():
                      continue
                  index += 1
                  Path(f'/tmp/sngamer-admin-inline-{index}.js').write_text(body, encoding='utf-8')
          print(f'Extracted {index} inline admin scripts for syntax checking.')
          PY
          for file in /tmp/sngamer-admin-inline-*.js; do
            node --check "$file"
          done

      - name: Harden admin authentication and session security
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('server/server.js')
          s = p.read_text(encoding='utf-8')

          old_session = '''app.use(\n  session({\n    secret: process.env.SESSION_SECRET || "sngamer-development-secret",\n    resave: false,\n    saveUninitialized: false,\n    cookie: {\n      httpOnly: true,\n      secure: process.env.NODE_ENV === "production",\n      maxAge: 1000 * 60 * 60 * 24\n    }\n  })\n);'''

          new_session = '''app.use(\n  session({\n    name: "sngamer.sid",\n    secret: process.env.SESSION_SECRET || "sngamer-development-secret",\n    resave: false,\n    saveUninitialized: false,\n    rolling: true,\n    cookie: {\n      httpOnly: true,\n      secure: process.env.NODE_ENV === "production",\n      sameSite: "lax",\n      maxAge: 1000 * 60 * 60 * 8\n    }\n  })\n);'''

          if old_session in s:
              s = s.replace(old_session, new_session, 1)
          elif 'name: "sngamer.sid"' not in s:
              raise SystemExit('Expected session configuration was not found.')

          marker = 'function requireAdmin(req, res, next) {'
          rate_limit_block = '''const adminLoginAttempts = new Map();\nconst ADMIN_LOGIN_WINDOW_MS = 15 * 60 * 1000;\nconst ADMIN_LOGIN_MAX_ATTEMPTS = 5;\n\nfunction checkAdminLoginRateLimit(ip) {\n  const now = Date.now();\n  const current = adminLoginAttempts.get(ip);\n  const attempts = current && now - current.startedAt < ADMIN_LOGIN_WINDOW_MS\n    ? current\n    : { startedAt: now, count: 0 };\n\n  if (attempts.count >= ADMIN_LOGIN_MAX_ATTEMPTS) {\n    return false;\n  }\n\n  attempts.count += 1;\n  adminLoginAttempts.set(ip, attempts);\n  return true;\n}\n\n'''
          if 'const adminLoginAttempts = new Map();' not in s:
              if marker not in s:
                  raise SystemExit('Admin authentication marker not found.')
              s = s.replace(marker, rate_limit_block + marker, 1)

          start = s.find('app.post("/api/admin/login", async (req, res) => {')
          end_marker = '\napp.post("/api/admin/logout", (req, res) => {'
          end = s.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('Admin login route boundaries not found.')

          login_route = '''app.post("/api/admin/login", async (req, res) => {\n  try {\n    const { username, password } = req.body || {};\n    const adminUser = process.env.ADMIN_USER;\n    const adminPassword = process.env.ADMIN_PASSWORD;\n\n    if (!adminUser || !adminPassword) {\n      return res.status(500).json({\n        error: "Configuration administrateur manquante"\n      });\n    }\n\n    if (!checkAdminLoginRateLimit(req.ip)) {\n      return res.status(429).json({\n        error: "Trop de tentatives de connexion. Réessayez plus tard."\n      });\n    }\n\n    if (username !== adminUser) {\n      return res.status(401).json({\n        error: "Identifiants incorrects"\n      });\n    }\n\n    let passwordValid = false;\n\n    if (\n      adminPassword.startsWith("$2a$") ||\n      adminPassword.startsWith("$2b$") ||\n      adminPassword.startsWith("$2y$")\n    ) {\n      passwordValid = await bcrypt.compare(password || "", adminPassword);\n    } else {\n      passwordValid = password === adminPassword;\n    }\n\n    if (!passwordValid) {\n      return res.status(401).json({\n        error: "Identifiants incorrects"\n      });\n    }\n\n    await new Promise((resolve, reject) => {\n      req.session.regenerate((error) => {\n        if (error) {\n          reject(error);\n          return;\n        }\n\n        req.session.admin = true;\n        req.session.save((saveError) => {\n          if (saveError) {\n            reject(saveError);\n            return;\n          }\n          resolve();\n        });\n      });\n    });\n\n    adminLoginAttempts.delete(req.ip);\n\n    return res.json({\n      success: true\n    });\n  } catch (error) {\n    console.error("ADMIN_LOGIN_ERROR:", error);\n\n    return res.status(500).json({\n      error: "Erreur de connexion"\n    });\n  }\n});\n'''

          s = s[:start] + login_route + s[end:]

          old_logout = '''app.post("/api/admin/logout", (req, res) => {\n  req.session.destroy(() => {\n    res.json({\n      success: true\n    });\n  });\n});'''
          new_logout = '''app.post("/api/admin/logout", (req, res) => {\n  req.session.destroy((error) => {\n    res.clearCookie("sngamer.sid");\n\n    if (error) {\n      return res.status(500).json({\n        error: "Impossible de fermer la session"\n      });\n    }\n\n    return res.json({\n      success: true\n    });\n  });\n});'''
          if old_logout in s:
              s = s.replace(old_logout, new_logout, 1)

          p.write_text(s, encoding='utf-8')
          print('Admin authentication hardening applied.')

      - name: Harden PayTech payment flow
        shell: python
        run: |
          from pathlib import Path

          p = Path('server/paytech.js')
          s = p.read_text(encoding='utf-8')

          old_columns = '''      ADD COLUMN IF NOT EXISTS paytech_token TEXT,\n      ADD COLUMN IF NOT EXISTS paid_at TIMESTAMPTZ,'''
          new_columns = '''      ADD COLUMN IF NOT EXISTS paytech_token TEXT,\n      ADD COLUMN IF NOT EXISTS payment_request_key TEXT,\n      ADD COLUMN IF NOT EXISTS paytech_redirect_url TEXT,\n      ADD COLUMN IF NOT EXISTS paid_at TIMESTAMPTZ,'''
          if old_columns in s and 'payment_request_key TEXT' not in s:
              s = s.replace(old_columns, new_columns, 1)

          index_marker = '''  await pool.query(`UPDATE orders SET status='Nouvelle' WHERE status='Payée' AND payment_status='Payé'`);'''
          index_block = '''  await pool.query(`UPDATE orders SET status='Nouvelle' WHERE status='Payée' AND payment_status='Payé'`);\n\n  await pool.query(`\n    CREATE UNIQUE INDEX IF NOT EXISTS idx_orders_payment_request_key_unique\n      ON orders(payment_request_key) WHERE payment_request_key IS NOT NULL;\n  `);'''
          if 'idx_orders_payment_request_key_unique' not in s:
              if index_marker not in s:
                  raise SystemExit('PayTech index insertion marker not found.')
              s = s.replace(index_marker, index_block, 1)

          old_body = '''      const { customer, payment, items } = req.body || {};\n      const allowedPayments = ["Wave", "Orange Money"];'''
          new_body = '''      const { customer, payment, items } = req.body || {};\n      const paymentRequestKey = String(req.body?.idempotency_key || "").trim();\n      const allowedPayments = ["Wave", "Orange Money"];\n      if (paymentRequestKey && !/^[A-Za-z0-9._:-]{16,120}$/.test(paymentRequestKey)) {\n        return res.status(400).json({ error: "Clé de paiement invalide." });\n      }\n\n      if (paymentRequestKey) {\n        const existing = await pool.query(\n          `SELECT id,payment_status,paytech_token,paytech_redirect_url FROM orders WHERE payment_request_key=$1 LIMIT 1`,\n          [paymentRequestKey]\n        );\n        if (existing.rows.length) {\n          const order = existing.rows[0];\n          if (order.paytech_redirect_url && order.payment_status === "En attente") {\n            return res.status(200).json({ success: true, orderId: order.id, token: order.paytech_token || null, redirect_url: order.paytech_redirect_url, reused: true });\n          }\n          if (order.payment_status === "Payé") {\n            return res.status(409).json({ error: "Cette tentative de paiement a déjà été validée." });\n          }\n          return res.status(409).json({ error: "Cette tentative de paiement est déjà en cours. Réessaie depuis le panier si nécessaire." });\n        }\n      }'''
          if old_body in s and 'const paymentRequestKey = String(req.body?.idempotency_key' not in s:
              s = s.replace(old_body, new_body, 1)

          old_insert = '''`INSERT INTO orders (status,customer,payment,items,total,payment_status,payment_method,paytech_ref)\n         VALUES ('Nouvelle',$1,$2,$3,$4,'En attente',$2,$5) RETURNING id`,\n        [JSON.stringify(orderCustomer), payment, JSON.stringify(finalItems), total, refCommand]'''
          new_insert = '''`INSERT INTO orders (status,customer,payment,items,total,payment_status,payment_method,paytech_ref,payment_request_key)\n         VALUES ('Nouvelle',$1,$2,$3,$4,'En attente',$2,$5,$6) RETURNING id`,\n        [JSON.stringify(orderCustomer), payment, JSON.stringify(finalItems), total, refCommand, paymentRequestKey || null]'''
          if old_insert in s and 'payment_request_key)' not in s:
              s = s.replace(old_insert, new_insert, 1)

          old_update = '''      await pool.query(`UPDATE orders SET paytech_token=$1 WHERE id=$2`, [result.token || null, orderId]);\n      return res.status(201).json({ success: true, orderId, token: result.token || null, redirect_url: redirectUrl });'''
          new_update = '''      await pool.query(`UPDATE orders SET paytech_token=$1,paytech_redirect_url=$2 WHERE id=$3`, [result.token || null, redirectUrl, orderId]);\n      return res.status(201).json({ success: true, orderId, token: result.token || null, redirect_url: redirectUrl });'''
          if old_update in s and 'paytech_redirect_url=$2' not in s:
              s = s.replace(old_update, new_update, 1)

          p.write_text(s, encoding='utf-8')

          checkout = Path('public/paytech-checkout.js')
          c = checkout.read_text(encoding='utf-8')
          marker = '''  async function paytechCheckoutSubmit() {\n    // Prevent double taps/clicks from creating multiple payment sessions.\n    if (checkoutInProgress) return;'''
          replacement = '''  function paymentAttemptKey() {\n    const storageKey = "sngamer.paytech.attempt";\n    try {\n      const current = sessionStorage.getItem(storageKey);\n      if (current && /^[A-Za-z0-9._:-]{16,120}$/.test(current)) return current;\n      const value = (crypto.randomUUID ? crypto.randomUUID() : `sng-${Date.now()}-${Math.random().toString(36).slice(2)}-${Math.random().toString(36).slice(2)}`);\n      sessionStorage.setItem(storageKey, value);\n      return value;\n    } catch (_) {\n      return `sng-${Date.now()}-${Math.random().toString(36).slice(2)}-${Math.random().toString(36).slice(2)}`;\n    }\n  }\n\n  function clearPaymentAttemptKey() {\n    try { sessionStorage.removeItem("sngamer.paytech.attempt"); } catch (_) {}\n  }\n\n  async function paytechCheckoutSubmit() {\n    // Prevent double taps/clicks from creating multiple payment sessions.\n    if (checkoutInProgress) return;'''
          if marker in c and 'function paymentAttemptKey()' not in c:
              c = c.replace(marker, replacement, 1)

          old_fetch_body = '''          payment,\n          items: basket.map((item) => ({'''
          new_fetch_body = '''          payment,\n          idempotency_key: paymentAttemptKey(),\n          items: basket.map((item) => ({'''
          if old_fetch_body in c and 'idempotency_key: paymentAttemptKey()' not in c:
              c = c.replace(old_fetch_body, new_fetch_body, 1)

          old_success = '''      window.location.assign(data.redirect_url);'''
          new_success = '''      clearPaymentAttemptKey();\n      window.location.assign(data.redirect_url);'''
          if old_success in c and 'clearPaymentAttemptKey();\n      window.location.assign' not in c:
              c = c.replace(old_success, new_success, 1)

          checkout.write_text(c, encoding='utf-8')
          print('PayTech idempotency hardening applied.')

      - name: Validate hardened payment code
        shell: bash
        run: |
          set -e
          node --check server/paytech.js
          node --check public/paytech-checkout.js

      - name: Commit injection
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/server.js server/paytech.js public/paytech-checkout.js public/admin.html public/admin-dashboard.html public/admin-data-fix.js server/customer-system.js server/bootstrap.js server/admin-data-fix-preload.js .github/workflows/inject-admin-v24.yml
          git commit -m 'security(payment): harden PayTech checkout idempotency'
          git push
