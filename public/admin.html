<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SNGAMER ADMIN</title><style>body{font-family:Arial;background:#070a10;color:#fff;margin:0}.wrap{max-width:1000px;margin:auto;padding:30px 20px}.box{background:#0d141e;border:1px solid #23364c;border-radius:14px;padding:20px;margin:15px 0}input,select{padding:11px;margin:5px;background:#111b28;color:#fff;border:1px solid #2b4059;border-radius:8px}button{padding:10px 15px;border:0;border-radius:8px;background:#3194ff;color:white;font-weight:800}.row{display:flex;gap:8px;flex-wrap:wrap}.muted{color:#8390a2}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #1c2938;text-align:left}</style></head><body><div class="wrap"><h1>SNGAMER STORE — ADMIN</h1><div id="login" class="box"><h2>Connexion</h2><input id="u" placeholder="Utilisateur"><input id="p" type="password" placeholder="Mot de passe"><button onclick="login()">Se connecter</button><p class="muted">Par défaut développement : admin / ChangeMe123!</p></div><div id="dash" style="display:none"><div class="box"><h2>Ajouter un produit</h2><div class="row"><input id="pn" placeholder="Nom"><input id="pc" placeholder="Catégorie"><input id="pp" type="number" placeholder="Prix"><input id="ps" type="number" placeholder="Stock"><input id="pe" placeholder="Emoji"></div><button onclick="add()">Ajouter</button></div><div class="box"><h2>Produits</h2><div id="prods"></div></div><div class="box"><h2>Commandes</h2><div id="orders"></div></div></div></div><script>async function login(){let r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u.value,password:p.value})});if(r.ok){loginBox();load()}else alert("Identifiants incorrects")}function loginBox(){document.querySelector("#login").style.display="none";document.querySelector("#dash").style.display="block"}async function load(){let p=await fetch("/api/products").then(r=>r.json()),o=await fetch("/api/admin/orders").then(r=>r.json());document.querySelector("#prods").innerHTML=p.map(x=>`<p>${x.emoji} <b>${x.name}</b> — ${x.price} FCFA — stock ${x.stock}</p>`).join("");document.querySelector("#orders").innerHTML=o.length?o.map(x=>`<p><b>${x.id}</b> — ${x.customer.name} — ${x.status} — ${x.payment}</p>`).join(""):"Aucune commande"}async function add(){await fetch("/api/admin/products",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:pn.value,category:pc.value,price:pp.value,stock:ps.value,emoji:pe.value})});load()}</script></body></html>
